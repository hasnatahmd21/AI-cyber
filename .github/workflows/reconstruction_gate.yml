name: AI-Cyber Reconstruction Gate

on:
  push:
    branches:
      - repair/forensic-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every Python source
        run: |
          python -m compileall -q -f .
      - name: Build deterministic forensic inventory
        run: |
          python tools/forensic_inventory.py --output forensic_inventory.json
          python - <<'PY'
          import json
          r=json.load(open("forensic_inventory.json"))
          print("python_file_count:", r["python_file_count"])
          print("syntax_error_files:", len(r["syntax_error_files"]))
          print("files_with_duplicate_top_level_definitions:", len(r["files_with_duplicate_top_level_definitions"]))
          print("cross_file_duplicate_definitions:", len(r["cross_file_duplicate_definitions"]))
          if r["syntax_error_files"]:
              raise SystemExit("SYNTAX GATE: repository still contains unparseable Python sources")
          PY
