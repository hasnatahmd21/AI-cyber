name: AI-CYBER Stage 0 Forensic Audit

on:
  push:
    branches:
      - repair/forensic-reconstruction
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-cyber-stage0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forensic-audit:
    name: Generate and verify Stage 0 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Hydrate Git LFS dataset payloads
        continue-on-error: true
        run: |
          if ! git lfs version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate quick forensic inventory
        if: always()
        run: python tools/forensic_inventory.py --output /tmp/forensic_inventory.json

      - name: Generate deep Stage 0 evidence
        if: always()
        run: |
          python -m py_compile tools/forensic_deep_audit.py
          python tools/forensic_deep_audit.py . \
            --json-out /tmp/ai-cyber-stage0-audit.json \
            --markdown-out /tmp/ai-cyber-stage0-audit.md \
            --summary-only

      - name: Independently verify forensic report hashes and source manifest
        if: success()
        run: python tools/verify_forensic_evidence.py /tmp/ai-cyber-stage0-audit.json --root . --expected-commit "$GITHUB_SHA"

      - name: Build Part 3 findings triage ledger
        if: success()
        run: |
          python tools/stage0_findings_review.py /tmp/ai-cyber-stage0-audit.json \
            --root . --expected-commit "$GITHUB_SHA" \
            --json-out /tmp/stage0-findings-review.json \
            --markdown-out /tmp/stage0-findings-review.md

      - name: Install package, tests and coverage tooling
        run: |
          python -m pip install --disable-pip-version-check -e . pytest pytest-timeout coverage
          python -m pip check

      - name: Run Stage 0 forensic tests
        run: python -m pytest -vv --durations=20 --timeout=300 tests/test_forensic_deep_audit.py tests/test_verify_forensic_evidence.py tests/test_stage0_findings_review.py

      - name: Run complete test suite with measured branch coverage
        id: project_coverage
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          set +e
          set -o pipefail
          python -m coverage run --branch --source=ai_cyber_os -m pytest -vv --durations=20 --timeout=300 tests 2>&1 | tee /tmp/stage0-coverage-pytest.log
          pytest_rc=${PIPESTATUS[0]}
          python -m coverage json --pretty-print -o /tmp/stage0-coverage.json
          json_rc=$?
          python -m coverage report -m > /tmp/stage0-coverage-summary.txt 2>&1
          report_rc=$?
          printf 'pytest_exit_code=%s\ncoverage_json_exit_code=%s\ncoverage_report_exit_code=%s\n' "$pytest_rc" "$json_rc" "$report_rc" > /tmp/stage0-coverage-status.txt
          cat /tmp/stage0-coverage-summary.txt
          test "$pytest_rc" -eq 0 && test "$json_rc" -eq 0 && test "$report_rc" -eq 0

      - name: Validate evidence identity, structure, and legacy coverage
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("/tmp/ai-cyber-stage0-audit.json")
          assert path.is_file() and path.stat().st_size > 0, "Deep audit JSON was not generated"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report.get("schema") == "ai-cyber.deep-forensic-audit.v1"
          assert report.get("commit_sha") == os.environ["GITHUB_SHA"], (
              report.get("commit_sha"), os.environ["GITHUB_SHA"]
          )
          assert isinstance(report.get("files"), list) and report["files"]
          assert isinstance(report.get("repository_inventory", {}).get("files"), list)
          assert report.get("summary", {}).get("file_content_manifest_sha256")
          assert report["summary"].get("git_lfs_pointer_count", 0) == 0, {
              "unhydrated_git_lfs_pointers": report["summary"].get("unhydrated_git_lfs_pointers", [])
          }

          expected_legacy = {
              "Assrf next .py",
              "HYDRA_FINAL_CLIENT_HANDOVER_FIXED.py",
              "HYDRA_MASTER_RECONSTRUCTED_v2.py",
              "HYDRA_patched-3.py",
              "IT_tech__MERGED_ALL_FIXES_APPLIED.py",
              "New tech .py",
          }
          present = set(report["summary"].get("legacy_forensic_files_present", []))
          assert present == expected_legacy, {
              "expected": sorted(expected_legacy), "present": sorted(present)
          }
          records = {item["path"]: item for item in report["files"]}
          required_fields = {
              "sha256", "syntax_ok", "syntax_error", "symbols", "imports", "calls",
              "main_guards", "side_effect_signals", "unused_import_candidates",
              "stub_candidates", "unreachable_statement_candidates", "todo_markers",
          }
          for name in sorted(expected_legacy):
              assert name in records, f"Missing AST record for legacy source: {name}"
              record = records[name]
              assert record.get("classification") == "legacy_forensic_candidate"
              assert len(record.get("sha256", "")) == 64
              assert required_fields <= set(record), {
                  "file": name, "missing_fields": sorted(required_fields - set(record))
              }

          core = records.get("src/ai_cyber_os/hydra.py")
          assert core is not None, "Canonical HYDRA source absent from forensic AST inventory"
          review_path = Path("/tmp/stage0-findings-review.json")
          assert review_path.is_file() and review_path.stat().st_size > 0, "Part 3 review ledger missing"
          review = json.loads(review_path.read_text(encoding="utf-8"))
          assert review.get("schema") == "ai-cyber.stage0-findings-review.v1"
          assert review.get("audit_commit_sha") == os.environ["GITHUB_SHA"]
          assert review.get("reviewed_commit_sha") == os.environ["GITHUB_SHA"]
          assert review.get("automated_green_claim") is False
          assert review.get("status") in {"REVIEW_REQUIRED", "BLOCKED"}
          print("Part 3 review-ledger status:", review["status"])
          print(json.dumps(report["summary"], indent=2, sort_keys=True))
          print("Legacy sources individually catalogued:", len(expected_legacy))
          PY

      - name: Publish concise forensic findings
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("/tmp/ai-cyber-stage0-audit.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report_path.is_file():
              summary_path.write_text(
                  "# Stage 0 Forensic Audit\n\n**BLOCKED:** no JSON evidence was generated.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report["summary"]
          rows = [
              "# Stage 0 Forensic Audit",
              "",
              f"- Commit: `{report.get('commit_sha') or 'missing'}`",
              f"- Repository files: {summary.get('repository_file_count')}",
              f"- Python files: {summary.get('python_file_count')}",
              f"- Syntax-error files: {summary.get('syntax_error_file_count')}",
              f"- Symbols / callsites: {summary.get('total_symbols')} / {summary.get('total_callsites')}",
              f"- Same-scope duplicate-definition files: {summary.get('files_with_duplicate_scoped_symbols')}",
              f"- Cross-file duplicate-name keys: {summary.get('cross_file_duplicate_symbol_keys')}",
              f"- Security-sensitive static signals (review candidates): {summary.get('side_effect_signal_count')}",
              f"- TODO/FIXME/etc. markers: {summary.get('todo_marker_count')}",
              f"- Unused-import candidates: {summary.get('unused_import_candidate_count')}",
              f"- Placeholder/stub candidates: {summary.get('stub_candidate_count')}",
              f"- Import-resolution candidates: {summary.get('import_resolution_finding_count')}",
              "",
              "## Legacy source inventory",
              "",
              "| Source | SHA-256 | Syntax | Symbols | Calls | Risk signals |",
              "|---|---|---:|---:|---:|---:|",
          ]
          records = {item["path"]: item for item in report.get("files", [])}
          for name in summary.get("legacy_forensic_files_present", []):
              item = records.get(name, {})
              rows.append(
                  f"| `{name}` | `{item.get('sha256', 'MISSING')}` | "
                  f"{'OK' if item.get('syntax_ok') else 'ERROR/UNKNOWN'} | "
                  f"{len(item.get('symbols', []))} | {len(item.get('calls', []))} | "
                  f"{len(item.get('side_effect_signals', []))} |"
              )
          syntax_errors = [
              (item["path"], item.get("syntax_error", {}))
              for item in report.get("files", []) if not item.get("syntax_ok")
          ]
          rows += ["", "## Syntax-error findings", ""]
          if syntax_errors:
              rows.extend(
                  f"- `{name}` L{error.get('line')}: {error.get('message')}"
                  for name, error in syntax_errors[:30]
              )
              if len(syntax_errors) > 30:
                  rows.append(f"- ... and {len(syntax_errors) - 30} more; see the JSON artifact.")
          else:
              rows.append("No Python syntax errors were detected by the static parser.")
          rows += [
              "",
              "> Static findings are investigation leads, not automatic vulnerability/dead-code verdicts. "
              "This report does not prove runtime security, isolation, cryptographic trust, or self-recovery.",
          ]
          summary_path.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Publish Part 3 review ledger to job summary
        if: always()
        run: |
          if [ -s /tmp/stage0-findings-review.md ]; then
            cat /tmp/stage0-findings-review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Stage 0 Part 3 review ledger" >> "$GITHUB_STEP_SUMMARY"
            echo "**BLOCKED:** review-ledger artifact was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-stage0-${{ github.sha }}
          path: |
            /tmp/ai-cyber-stage0-audit.json
            /tmp/ai-cyber-stage0-audit.md
            /tmp/stage0-findings-review.json
            /tmp/stage0-findings-review.md
            /tmp/forensic_inventory.json
            /tmp/stage0-coverage-pytest.log
            /tmp/stage0-coverage.json
            /tmp/stage0-coverage-summary.txt
            /tmp/stage0-coverage-status.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce complete Stage 0 gates
        if: always()
        run: |
          test "${{ steps.project_coverage.outcome }}" = "success"
          test -s /tmp/stage0-findings-review.json
          test -s /tmp/stage0-findings-review.md
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          review = json.loads(Path("/tmp/stage0-findings-review.json").read_text(encoding="utf-8"))
          assert review.get("audit_commit_sha") == os.environ["GITHUB_SHA"]
          assert review.get("automated_green_claim") is False
          PY
