name: Stage 4 Security Evaluation

on:
  push:
    branches:
      - fix/dataset-parser-readiness
    paths:
      - "src/ai_cyber_os/security_evaluation.py"
      - "src/ai_cyber_os/security_evaluation_runtime.py"
      - "src/ai_cyber_os/knowledge_runtime.py"
      - "src/ai_cyber_os/knowledge.py"
      - "src/ai_cyber_os/rag.py"
      - "src/ai_cyber_os/intelligence.py"
      - "src/ai_cyber_os/ui.py"
      - "scripts/kaggle_build_knowledge_db.py"
      - "scripts/verify_live_rag_api.py"
      - "tests/test_security_evaluation.py"
      - "tests/test_security_evaluation_runtime.py"
      - "tests/test_knowledge_runtime.py"
      - "tests/test_knowledge_api_runtime.py"
      - "tests/test_rag.py"
      - "tests/test_knowledge.py"
      - "pyproject.toml"
      - ".github/workflows/stage4-security-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4-security-evaluation
  cancel-in-progress: true

jobs:
  stage4-evaluation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dataset-parser-readiness
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing project and focused test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile Stage 3 and Stage 4 integration
        run: |
          python -m compileall -q \
            src/ai_cyber_os/security_evaluation.py \
            src/ai_cyber_os/security_evaluation_runtime.py \
            src/ai_cyber_os/knowledge_runtime.py \
            src/ai_cyber_os/knowledge.py \
            src/ai_cyber_os/rag.py \
            src/ai_cyber_os/ui.py \
            scripts/kaggle_build_knowledge_db.py \
            scripts/verify_live_rag_api.py \
            tests/test_security_evaluation.py \
            tests/test_security_evaluation_runtime.py \
            tests/test_knowledge_runtime.py \
            tests/test_knowledge_api_runtime.py
      - name: Run Stage 4 evaluator and API contract tests
        env:
          PYTHONPATH: src
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest -q \
            tests/test_security_evaluation.py \
            tests/test_security_evaluation_runtime.py \
            tests/test_knowledge_runtime.py \
            tests/test_knowledge_api_runtime.py \
            tests/test_rag.py \
            tests/test_knowledge.py
