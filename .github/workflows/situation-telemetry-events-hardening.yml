name: AI-CYBER Situation Telemetry Events Hardening

on:
  push:
    branches: [hardening/situation-telemetry-events, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  situation-telemetry-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile src/ai_cyber_os/situation.py
          python -m py_compile tests/test_situation.py
      - name: #6 suite
        run: python -m pytest -q tests/test_situation.py
      - name: #1 RAG regression
        run: python -m pytest -q tests/test_knowledge.py
      - name: #2 dataset regression
        run: python -m pytest -q tests/test_dataset_pipeline.py
      - name: #3 family regression
        run: python -m pytest -q tests/test_security_families.py
      - name: #4 relationship regression
        run: python -m pytest -q tests/test_relationships.py
      - name: #5 backend regression
        run: python -m pytest -q tests/test_backend.py
      - name: Integrated GREEN gate
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ai_cyber_os.situation import SituationStore, TelemetryEvent
          with TemporaryDirectory() as td:
              s=SituationStore(Path(td)/"s.sqlite")
              s.ingest(TelemetryEvent(event_type="alert",observed_at="2026-10-08T12:00:00Z",source="integration",severity="HIGH",subject_type="asset",subject_id="host-1",payload={"signal":"observed"}))
              assert s.health()["ok"] and len(s.query(subject_id="host-1"))==1
              assert s.situation(subject_type="asset",subject_id="host-1",start="2026-10-08T11:59:00Z",end="2026-10-08T12:01:00Z")["evidence_only"]
              print("SITUATION_TELEMETRY_EVENTS_INTEGRITY_GATE=GREEN")
          PY
