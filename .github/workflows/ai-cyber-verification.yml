name: AI-CYBER verification

on:
  push:
    branches: ["repair/forensic-reconstruction", "feature-layered-defense-wiring"]
  pull_request:

permissions:
  contents: read

# Keep repeated pushes from spawning an unbounded backlog of identical full-suite jobs.
concurrency:
  group: ai-cyber-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run tests with progress logging and per-test timeout
        env:
          PYTHONPATH: src
          PYTHONFAULTHANDLER: "1"
        run: pytest -vv --durations=20 --timeout=300 tests
      - name: Run Phase 13 standalone security evaluation
        run: python tools/phase13_security_evaluation_test.py
