name: AI-CYBER verification

on:
  push:
    branches: ["repair/forensic-reconstruction"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run tests
        run: pytest -q tests
      - name: Run Phase 13 standalone security evaluation
        run: python tools/phase13_security_evaluation_test.py
