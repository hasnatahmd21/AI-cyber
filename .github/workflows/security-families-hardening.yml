name: AI-CYBER Security Families Hardening

on:
  push:
    branches:
      - hardening/security-families
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-families:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile security family layer
        run: |
          python -m py_compile src/ai_cyber_os/security_families.py
          python -m py_compile tests/test_security_families.py

      - name: Security family regression suite
        run: python -m pytest -q tests/test_security_families.py

      - name: 13-family integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from ai_cyber_os.security_families import FAMILIES, SecurityFamilyStore, family_catalog, normalize_record

          assert len(FAMILIES) == 13
          assert len(family_catalog()) == 13

          with tempfile.TemporaryDirectory() as td:
              store = SecurityFamilyStore(Path(td) / "security.sqlite")
              for i, family in enumerate(FAMILIES):
                  store.upsert(normalize_record({
                      "record_id": f"gate-{i}",
                      "family": family,
                      "title": f"Gate record {i}",
                  }))
              result = store.verify_integrity()
              assert result["ok"] is True
              assert result["family_count"] == 13
              assert result["record_count"] == 13
          print("SECURITY_FAMILIES_INTEGRITY_GATE=GREEN")
          PY
