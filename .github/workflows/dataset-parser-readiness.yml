name: Dataset parser readiness regression

on:
  push:
    branches: ["fix/dataset-parser-readiness"]
  pull_request:
    branches: ["repair/forensic-reconstruction"]
    paths:
      - "src/ai_cyber_os/knowledge.py"
      - "src/ai_cyber_os/knowledge_runtime.py"
      - "src/ai_cyber_os/dataset_pipeline.py"
      - "src/ai_cyber_os/threat_intel.py"
      - "src/ai_cyber_os/dataset_readiness.py"
      - "src/ai_cyber_os/knowledge_cli.py"
      - "tests/test_dataset_specific_parsers.py"
      - "tests/test_dataset_pipeline.py"
      - "tests/test_nvd_feed_readiness.py"
      - "tests/test_threat_intel.py"
      - "tests/test_knowledge.py"
      - "tests/test_knowledge_runtime.py"
      - "tests/test_knowledge_api_runtime.py"
      - "tests/test_rag.py"
      - "scripts/kaggle_dataset_parser_readiness_gate.py"
      - "scripts/kaggle_nvd_feed_readiness.py"
      - "scripts/kaggle_build_knowledge_db.py"
      - "scripts/verify_live_rag_api.py"
      - "tools/kaggle_acquire_datasets.py"
      - "tests/test_dataset_acquisition_runner.py"
      - "docs/REAL_DATASET_RUNBOOK.md"
      - ".github/workflows/dataset-parser-readiness.yml"

permissions:
  contents: read

concurrency:
  group: dataset-parser-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and focused test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile parser, readiness, and test modules
        run: |
          python -m compileall -q src/ai_cyber_os tests scripts/kaggle_dataset_parser_readiness_gate.py scripts/kaggle_nvd_feed_readiness.py scripts/kaggle_build_knowledge_db.py scripts/verify_live_rag_api.py tools/kaggle_acquire_datasets.py
      - name: Run focused parser/readiness and existing knowledge regression tests
        env:
          PYTHONPATH: src
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest -q \
            tests/test_dataset_specific_parsers.py \
            tests/test_dataset_pipeline.py \
            tests/test_nvd_feed_readiness.py \
            tests/test_threat_intel.py \
            tests/test_knowledge.py \
            tests/test_knowledge_runtime.py \
            tests/test_knowledge_api_runtime.py \
            tests/test_rag.py \
            tests/test_dataset_acquisition_runner.py
      - name: Audit committed real source artifacts without ingestion
        id: real_source_audit
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p artifacts
          python scripts/kaggle_dataset_parser_readiness_gate.py \
            --raw-root datasets/raw \
            --report artifacts/dataset_parser_readiness_report.json
      - name: Upload the real-source readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-parser-readiness-report
          path: artifacts/dataset_parser_readiness_report.json
          if-no-files-found: warn
