name: HYDRA Brain new-tech integration

on:
  push:
    branches:
      - feature/integrate-hydra-brain-newtech
    paths:
      - "layered_defense/**"
      - "src/ai_cyber_os/**"
      - "pyproject.toml"
      - ".github/workflows/hydra-newtech-integration.yml"

permissions:
  contents: read

concurrency:
  group: hydra-newtech-integration
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
      - name: Compile application, layered defence and phase files
        run: python -m compileall -q src tests layered_defense/ai_cyber
      - name: Run repository non-UI regression tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: pytest -vv --durations=20 --timeout=300 --ignore=tests/test_ui.py tests
      - name: Run sequential defence gates including HYDRA Brain integration
        working-directory: layered_defense
        env:
          PYTHONPATH: .:../src
          PYTHONFAULTHANDLER: "1"
        run: python run_gates.py
      - name: Run secured legacy and new-tech HYDRA suites together
        working-directory: layered_defense
        env:
          PYTHONPATH: .:../src
          PYTHONFAULTHANDLER: "1"
        run: python -m ai_cyber hydra-check --run
