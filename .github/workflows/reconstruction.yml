name: AI-Cyber Forensic Verification

on:
  push:
    branches:
      - repair/forensic-reconstruction

permissions:
  contents: read

concurrency:
  group: ai-cyber-forensic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  forensic:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository forensic audit
        run: python tools/forensic_audit.py --json > forensic-report.json
      - name: Validate audit output
        run: test -s forensic-report.json
      - name: Compile legacy sources
        run: |
          python -m py_compile "Assrf next .py"
          python -m py_compile "HYDRA_FINAL_CLIENT_HANDOVER_FIXED.py"
          python -m py_compile "HYDRA_MASTER_RECONSTRUCTED_v2.py"
          python -m py_compile "HYDRA_patched-3.py"
          python -m py_compile "IT_tech__MERGED_ALL_FIXES_APPLIED.py"
          python -m py_compile "New tech .py"
      - name: Run forensic unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_forensic_audit.py
