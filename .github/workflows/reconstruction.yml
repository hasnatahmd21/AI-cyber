name: AI-Cyber Reconstruction Verification
# Canonical 27-phase runtime verification gate.

on:
  push:
    branches:
      - repair/forensic-reconstruction
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-cyber-reconstruction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile canonical runtime and verification tooling
        run: |
          python -m py_compile src/ai_cyber_os/hydra.py
          python -m py_compile src/ai_cyber_os/__init__.py
          python -m py_compile src/ai_cyber_os/protected_data.py
          python -m py_compile src/ai_cyber_os/rag.py src/ai_cyber_os/runtime_intelligence.py
          python -m py_compile src/ai_cyber_os/threat_intel.py src/ai_cyber_os/network_intel.py src/ai_cyber_os/malware_intel.py src/ai_cyber_os/integration_evaluation.py src/ai_cyber_os/continuous_update.py src/ai_cyber_os/intelligence_hydra.py
          python -m py_compile tools/forensic_audit.py
          python -m py_compile tools/forensic_inventory.py
          python -m py_compile tests/*.py
      - name: Run forensic inventory
        run: python tools/forensic_inventory.py --output forensic_inventory.json
      - name: Install test runner
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pip check
      - name: Run focused verification
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests

      - name: Validate real dataset readiness tooling
        run: |
          python tools/real_dataset_readiness.py . --json-out /tmp/dataset-readiness.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/dataset-readiness.json").read_text())
          assert "files" in data and "bytes" in data
          PY

      - name: Run intelligence integration evaluation
        env:
          PYTHONPATH: src
        run: python tools/intelligence_evaluation.py all

      - name: Run complete dataset pipeline end-to-end test
        env:
          PYTHONPATH: src
        run: python tools/end_to_end_dataset_test.py

      - name: Run knowledge pipeline smoke test
        env:
          PYTHONPATH: src
        run: python tools/knowledge_smoke_test.py

      - name: Run installed CLI operational check
        run: |
          command -v ai-cyber
          ai-cyber --phase all --hardening --json > cli_operational_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("cli_operational_result.json").read_text(encoding="utf-8"))
          assert data["phase_result"]["summary"]["success"] is True, data
          assert data["hardening_result"]["verified"] is True, data
          assert data["hardening_result"]["failed"] == 0, data
          PY
      - name: Run extended intelligence CLI
        run: |
          ai-cyber --extended-all --json > extended_intelligence_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("extended_intelligence_result.json").read_text(encoding="utf-8"))
          assert data["phase_result"]["summary"]["success"] is True, data
          PY

      - name: Build and smoke-test distributable wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir /tmp/ai-cyber-dist
          python -m venv /tmp/ai-cyber-wheel-env
          /tmp/ai-cyber-wheel-env/bin/python -m pip install --disable-pip-version-check /tmp/ai-cyber-dist/*.whl
          /tmp/ai-cyber-wheel-env/bin/python -m pip check
          /tmp/ai-cyber-wheel-env/bin/ai-cyber --phase all --hardening --json > wheel_cli_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("wheel_cli_result.json").read_text(encoding="utf-8"))
          assert data["phase_result"]["summary"]["success"] is True, data
          assert data["hardening_result"]["verified"] is True, data
          assert data["hardening_result"]["failed"] == 0, data
          PY
      - name: Run controlled Red-Team vs Blue-Team adversarial verification
        run: python tools/red_blue_adversarial_test.py
      - name: Run extended intelligence HYDRA registration
        env:
          PYTHONPATH: src
        run: python -c "from ai_cyber_os.intelligence_hydra import run_all_extended; r=run_all_extended(); assert r['summary']['success'], r"

      - name: Run complete 27-phase runtime verification
        env:
          PYTHONPATH: src
        run: python -c "from ai_cyber_os.hydra import run_hydra_phase; r=run_hydra_phase('all'); assert r['summary']['success'], r"
      - name: Run final hardening verification
        env:
          PYTHONPATH: src
        run: python -c "from ai_cyber_os.hydra import run_final_hardening_verification; r=run_final_hardening_verification(); assert r['verified'] and r['failed']==0, r"
      - name: Verify baseline artifacts
        run: |
          test -s docs/FORENSIC_BASELINE.md
          test -s docs/FORENSIC_BASELINE.json
