name: Import and verify layered defense project

on:
  workflow_dispatch:
  push:
    branches:
      - feature/import-layered-project
    paths:
      - .github/workflows/import-layered-project.yml
  pull_request:
    branches:
      - repair/forensic-reconstruction

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: import-layered-project-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  import-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-cyber source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Download and safely extract project ZIP into AI-cyber
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          import stat
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          url = "https://raw.githubusercontent.com/hasnatahmd21/Vexon/main/ai_cyber_project.zip"
          archive = Path("/tmp/ai_cyber_project.zip")
          target = Path("layered_defense")
          prefix = "ai_cyber_project/"

          if target.exists():
              raise SystemExit("Refusing to overwrite existing layered_defense/; inspect it before re-importing.")

          urllib.request.urlretrieve(url, archive)
          if not zipfile.is_zipfile(archive):
              raise SystemExit("Downloaded source is not a valid ZIP archive.")

          target.mkdir(parents=True)
          try:
              with zipfile.ZipFile(archive) as zf:
                  members = zf.infolist()
                  if not members:
                      raise SystemExit("Source ZIP is empty.")
                  for info in members:
                      name = info.filename
                      p = PurePosixPath(name)
                      mode = info.external_attr >> 16
                      if p.is_absolute() or ".." in p.parts:
                          raise SystemExit(f"Unsafe ZIP path: {name}")
                      if stat.S_ISLNK(mode):
                          raise SystemExit(f"Symlink not allowed in ZIP: {name}")
                      if not name.startswith(prefix):
                          raise SystemExit(f"Unexpected ZIP root (expected {prefix}): {name}")
                      relative = p.parts[1:]
                      if not relative:
                          continue
                      out = target.joinpath(*relative)
                      if info.is_dir():
                          out.mkdir(parents=True, exist_ok=True)
                      else:
                          out.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info) as src, out.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

              required = [
                  target / "run_gates.py",
                  target / "ai_cyber" / "legacy" / "split_manifest.json",
                  target / "ai_cyber" / "legacy" / "symbol_map.json",
                  target / "tests" / "__init__.py",
                  target / "docs",
                  target / "tools",
              ]
              missing = [str(p) for p in required if not p.exists()]
              if missing:
                  raise SystemExit("Required layout entries missing: " + ", ".join(missing))
          except Exception:
              shutil.rmtree(target, ignore_errors=True)
              raise
          PY

      - name: Compile imported project
        run: python -m compileall -q layered_defense

      - name: Run Gates 0–10
        working-directory: layered_defense
        run: python run_gates.py

      - name: Run complete unittest discovery
        working-directory: layered_defense
        run: python -m unittest discover -s tests -t .

      - name: Remove generated bytecode
        if: always()
        run: |
          find layered_defense -type d -name __pycache__ -prune -exec rm -rf {} +
          find layered_defense -type f -name '*.py[co]' -delete

      - name: Commit verified imported project to source branch
        if: success()
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layered_defense
          if git diff --cached --quiet; then
            echo "No imported-project changes to commit."
            exit 0
          fi
          git commit -m "Import verified layered defense project into AI-cyber"
          git push origin "HEAD:${SOURCE_BRANCH}"
