name: Import and verify layered defense project

on:
  workflow_dispatch:
  push:
    branches:
      - feature/import-layered-project
    paths:
      - .github/workflows/import-layered-project.yml
  pull_request:
    branches:
      - repair/forensic-reconstruction

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: import-layered-project-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  import-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-cyber source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Validate imported project folder in AI-cyber
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path("layered_defense")
          required = [
              target / "run_gates.py",
              target / "ai_cyber" / "legacy" / "split_manifest.json",
              target / "ai_cyber" / "legacy" / "symbol_map.json",
              target / "tests" / "__init__.py",
              target / "docs",
              target / "tools",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Required AI-cyber project layout entries missing: " + ", ".join(missing))
          print("AI-cyber contains the standalone layered project. No external repository is used.")
          PY

      - name: Compile imported project
        run: python -m compileall -q layered_defense

      - name: Run Gates 0–14
        working-directory: layered_defense
        run: python run_gates.py

      - name: Run complete unittest discovery
        working-directory: layered_defense
        run: python -m unittest discover -s tests -t .

      - name: Remove generated bytecode
        if: always()
        run: |
          find layered_defense -type d -name __pycache__ -prune -exec rm -rf {} +
          find layered_defense -type f -name '*.py[co]' -delete
