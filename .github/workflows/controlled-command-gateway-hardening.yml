name: AI-CYBER Controlled Command Gateway Hardening

on:
  push:
    branches: [hardening/controlled-command-gateway, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-command-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile src/ai_cyber_os/commands.py
          python -m py_compile tests/test_commands.py
      - name: #7 command-gateway adversarial suite
        run: python -m pytest -q tests/test_commands.py
      - name: #1 RAG regression
        run: python -m pytest -q tests/test_knowledge.py
      - name: #2 dataset regression
        run: python -m pytest -q tests/test_dataset_pipeline.py
      - name: #3 family regression
        run: python -m pytest -q tests/test_security_families.py
      - name: #4 relationship regression
        run: python -m pytest -q tests/test_relationships.py
      - name: #5 backend regression
        run: python -m pytest -q tests/test_backend.py
      - name: #6 situation regression
        run: python -m pytest -q tests/test_situation.py
      - name: Integrated GREEN gate
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from ai_cyber_os.commands import CommandSpec, ControlledCommandGateway
          from ai_cyber_os.situation import SituationStore

          with TemporaryDirectory() as td:
              root = Path(td)
              audit = SituationStore(root / "situation.sqlite")
              script = "print('gateway-green')"
              policy = CommandSpec(
                  name="probe",
                  executable=sys.executable,
                  allowed_argv=(("-c", script),),
              )
              gateway = ControlledCommandGateway(
                  [policy],
                  workspace_root=root,
                  audit_store=audit,
              )
              result = gateway.execute("probe", ("-c", script))
              assert result.ok
              assert result.stdout.strip() == "gateway-green"
              assert audit.health()["ok"]
              assert audit.query(event_types=("process",))
              print("CONTROLLED_COMMAND_GATEWAY_INTEGRITY_GATE=GREEN")
          PY
