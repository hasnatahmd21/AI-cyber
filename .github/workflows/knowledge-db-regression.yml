name: Knowledge DB Regression Tests

on:
  push:
    branches:
      - work/permanent-knowledge-db-build
    paths:
      - ".github/workflows/knowledge-db-regression.yml"
      - "pyproject.toml"
      - "src/ai_cyber_os/**"
      - "tests/**"
      - "scripts/build_permanent_knowledge_db.py"
      - "scripts/verify_live_rag_api.py"

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src:layered_defense
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout current isolated build branch
        uses: actions/checkout@v4
        with:
          ref: work/permanent-knowledge-db-build
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile project and scripts
        run: python -m compileall -q src scripts

      - name: Run non-legacy-UI regression suite
        shell: bash
        run: |
          mkdir -p build-output
          python -m pytest -q --ignore=tests/test_ui.py \
            --junitxml=build-output/pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-db-regression-report-${{ github.run_number }}
          path: build-output/pytest-report.xml
          if-no-files-found: warn
          retention-days: 30
