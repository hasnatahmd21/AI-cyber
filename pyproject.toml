[project]
name = "ai-cyber-os"
version = "0.1.0"
description = "Canonical AI-Cyber cybersecurity intelligence and operations runtime"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "cryptography>=42,<47",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx2>=2.13,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
