[project]
name = "ai-cyber-os"
version = "0.1.0"
description = "Canonical AI-Cyber cybersecurity intelligence and operations runtime"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "cryptography>=42,<47",
]

[project.scripts]
ai-cyber = "ai_cyber_os.__main__:main"
ai-cyber-ui = "ai_cyber_os.ui:main"
ai-cyber-knowledge = "ai_cyber_os.knowledge_cli:main"\nai-cyber-evaluate = "ai_cyber_os.security_evaluation:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ai_cyber_os = ["ui_template.html"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
